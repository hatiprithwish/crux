name: Deploy Web (Staging)

on:
  push:
    branches: [staging]
    paths:
      - "apps/web/**"
      - "packages/schemas/**"
  # DEV_NOTE: manual trigger is the rollback/redeploy path — the push filters above mean a
  # revert that touches no app file would otherwise never redeploy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate secrets
        run: |
          missing=()
          while IFS= read -r line; do
            [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
            key="${line%%=*}"
            [[ -z "${!key}" ]] && missing+=("$key")
          done < apps/web/.env.example
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "❌ Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "✅ All secrets present"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Lint
        run: pnpm --filter web --filter @app/schemas lint

      - name: Build
        run: pnpm --filter web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # DEV_NOTE: typecheck and test MUST run after Build, not before. src/routeTree.gen.ts is
      # gitignored and only written by the TanStack router plugin during `vite build`, so on a
      # fresh CI checkout `tsc` would fail on the missing import in src/router.tsx.
      - name: Typecheck
        run: pnpm --filter web --filter @app/schemas typecheck

      - name: Test
        run: pnpm --filter web test

      # DEV_NOTE: the generated config resolves the top-level env (name "crux-web"), so the
      # deploy target has to be re-stamped here. `vars` is deliberately not patched — the client
      # reads VITE_* via import.meta.env, inlined during Build above from the secrets.
      - name: Patch wrangler config for staging
        working-directory: apps/web
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
            cfg.name = 'crux-web-staging';
            fs.writeFileSync('dist/server/wrangler.json', JSON.stringify(cfg));
          "

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: pnpm wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
