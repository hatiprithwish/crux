name: Deploy Worker (Production)

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/schemas/**"
  # DEV_NOTE: manual trigger is the rollback/redeploy path — the push filters above mean a
  # revert that touches no app file would otherwise never redeploy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate secrets
        run: |
          missing=()
          while IFS= read -r line; do
            [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
            [[ "$line" != *"# ci-required"* ]] && continue
            key="${line%%=*}"
            key="${key%% *}"
            [[ -z "${!key}" ]] && missing+=("$key")
          done < apps/backend/.dev.vars.example
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "❌ Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "✅ All secrets present"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Lint
        run: pnpm --filter backend --filter @app/schemas lint

      - name: Typecheck
        run: pnpm --filter backend --filter @app/schemas typecheck

      # DEV_NOTE: `pnpm --filter backend test` is deliberately NOT a gate here. The D1 binding is
      # `remote: true` (wrangler.jsonc), so the suite runs every query against the real crux-db
      # over the network — it is flaky in CI and would write test rows into live data. Make the
      # suite hermetic (a local test-only D1 binding) before adding it back.

      # DEV_NOTE: migrations run before the deploy so the new code never boots against an older
      # schema. Safe to re-run — D1 keeps an applied-migrations ledger, so this is a no-op when
      # staging already applied them (staging and production currently share one database).
      - name: Apply D1 migrations
        run: pnpm --filter backend db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          command: deploy --env production
